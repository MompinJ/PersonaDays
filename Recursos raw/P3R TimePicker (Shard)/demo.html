<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3R TimePicker · Demo — 3 opciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@600;700;800&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<link href="p3r-timepicker.css" rel="stylesheet">
<style>
  html, body { margin: 0; min-height: 100%;
    background: radial-gradient(130% 90% at 70% 12%, #11233F 0%, #0A1226 55%, #070F1E 100%);
    color: #EAF2FF; font-family: 'Exo 2', system-ui, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 56px 24px 90px; }
  .kicker { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; font-size: 13px; color: #16C7E6; }
  h1 { font-family: 'Anton', sans-serif; font-size: 48px; margin: 6px 0 4px; transform: skewX(-5deg);
    letter-spacing: .5px; }
  .sub { color: #7589B8; font-size: 16px; margin-bottom: 30px; max-width: 60ch; }
  .hr { height: 1.5px; background: #2A3E82; opacity: .5; margin: 6px 0 34px; transform: skewX(-12deg); }
  .swrow { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; margin-bottom: 8px; }
  .swatches { display: flex; gap: 10px; }
  .sw { width: 28px; height: 28px; cursor: pointer; transform: skewX(-9deg);
    border: 2px solid transparent; transition: border-color .12s; }
  .sw.on { border-color: #EAF2FF; }
  .swlbl { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1.5px; font-size: 14px; color: #45568A; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 26px 30px; margin-top: 34px; }
  .opt { }
  .opt-tag { display: inline-block; background: var(--c, #3D7BFF); color: #03101F; transform: skewX(-12deg);
    padding: 5px 18px 6px; clip-path: polygon(0 0,100% 0,92% 100%,0 100%); box-shadow: 5px 6px 0 rgba(0,0,0,.4);
    margin-bottom: 6px; }
  .opt-tag > span { display: inline-block; transform: skewX(12deg); font-family: 'Anton', sans-serif;
    font-size: 20px; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
  .opt-prop { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; letter-spacing: 1.5px;
    font-size: 12px; color: #16C7E6; text-transform: uppercase; margin: 10px 0 4px; }
  .opt-desc { color: #7589B8; font-size: 14px; line-height: 1.45; margin: 0 0 16px; min-height: 60px; }
  .out { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px;
    color: #EAF2FF; margin-top: 14px; min-height: 26px; }
  .out span { color: #7589B8; font-weight: 600; font-size: 13px; font-family: 'Exo 2'; }
</style>
</head>
<body>
<div class="wrap"><div id="root"></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="p3r-timepicker-core.js"></script>
<script type="text/babel" src="p3r-timepicker.jsx"></script>
<script type="text/babel">
const { useState } = React;
const T = window.P3RTime;
const THEMES = [
  { name: 'AZUL',   accent: '#3D7BFF', accent2: '#16C7E6' },
  { name: 'VERDE',  accent: '#2BE6A6', accent2: '#7CF3CC' },
  { name: 'KOTONE', accent: '#FF5BA0', accent2: '#FFB0D2' },
  { name: 'REN',    accent: '#FF3B4A', accent2: '#FF9098' },
  { name: 'AIGIS',  accent: '#F4B43A', accent2: '#FFDD96' },
];
const OPTIONS = [
  { id: 'steppers', name: 'A · STEPPERS', prop: "variant=\"steppers\"",
    desc: 'Columnas HH : MM con flechas ‹arriba/abajo›. Mantén pulsado para avanzar rápido. Minutos 1 a 1. La más compacta y la más "P3R".' },
  { id: 'wheel', name: 'B · WHEEL', prop: "variant=\"wheel\"",
    desc: 'Ruedas con scroll y banda central iluminada. Gesto rápido tipo móvil; arrastra o toca un número. Minutos 1 a 1.' },
  { id: 'grid', name: 'C · GRID', prop: "variant=\"grid\"",
    desc: 'Rejilla por pestañas HORA / MIN, igual que la rejilla de años del DatePicker. Minutos en pasos (gridStep, def. 5).' },
];
const fmtOut = (v) => v ? (T.fmt(v, '24') + '  ·  ' + T.fmt(v, '12')) : null;

function Demo() {
  const [ti, setTi] = useState(0);
  const t = THEMES[ti];
  const [vals, setVals] = useState({ steppers: { h: 8, m: 30 }, wheel: { h: 14, m: 5 }, grid: { h: 21, m: 45 } });
  const setV = (id) => (nv) => setVals((s) => ({ ...s, [id]: nv }));

  return (
    <div>
      <div className="kicker">PersonaDays · Componente</div>
      <h1>P3R TIMEPICKER</h1>
      <p className="sub">Selector de hora estilo Persona 3 Reload. Reemplaza al diálogo nativo — toca cualquier campo para abrirlo. Dentro, el toggle <b style={{color:'#16C7E6'}}>24H / 12H</b> intercala el formato sin perder la hora. Abajo, las <b>3 opciones</b>: elige una y pásasela a Claude Code por la prop <code style={{color:'#16C7E6'}}>variant</code>.</p>

      <div className="swrow">
        <span class="swlbl">TEMA (PROTAGONISTA)</span>
        <div className="swatches">
          {THEMES.map((x, i) => (
            <div key={x.name} className={'sw' + (i===ti?' on':'')} style={{ background:x.accent }} onClick={() => setTi(i)} title={x.name}></div>
          ))}
        </div>
      </div>
      <div className="hr"></div>

      <div className="cards">
        {OPTIONS.map((o) => (
          <div className="opt" key={o.id} style={{ '--c': t.accent }}>
            <div className="opt-tag"><span>{o.name}</span></div>
            <div className="opt-prop">{o.prop}</div>
            <p className="opt-desc">{o.desc}</p>
            <P3RTimePicker
              value={vals[o.id]} onChange={setV(o.id)}
              variant={o.id} defaultMode="24"
              accent={t.accent} accent2={t.accent2}
            />
            <div className="out">{fmtOut(vals[o.id])}</div>
          </div>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
